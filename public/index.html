<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basis</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel hero">
        <p class="eyebrow">Basis</p>
        <h1>Вход в общий поток обращений</h1>
        <p class="lead">
          Пользователь входит по логину и паролю, созданным в PocketBase администратором.
        </p>
      </section>

      <section class="panel auth-panel" id="auth-panel">
        <div id="guest-view">
          <h2>Авторизация</h2>
          <form id="login-form" class="stack">
            <label class="field">
              <span>Логин или email</span>
              <input id="identity" name="identity" type="text" autocomplete="username" required />
            </label>

            <label class="field">
              <span>Пароль</span>
              <input id="password" name="password" type="password" autocomplete="current-password" required />
            </label>

            <button class="button" type="submit">Войти</button>
          </form>
        </div>

        <div id="user-view" class="hidden">
          <div class="user-bar">
            <div>
              <h2>Общий поток обращений</h2>
              <p class="status-line">
                Вы вошли как <strong id="user-name"></strong>.
              </p>
            </div>
            <button class="button secondary" id="logout-button" type="button">Выйти</button>
          </div>

          <form id="request-form" class="stack composer">
            <label class="field">
              <span>Текст обращения</span>
              <textarea
                id="message"
                name="message"
                rows="4"
                placeholder="Например: привет, нужна помощь с заказом"
                required
              ></textarea>
            </label>

            <button class="button" type="submit">Отправить обращение</button>
          </form>

          <div class="stream-head">
            <p class="muted">
              Ниже видны все обращения всех авторизованных пользователей.
            </p>
            <button class="button ghost" id="refresh-button" type="button">Обновить</button>
          </div>

          <div id="requests-list" class="requests-list"></div>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
